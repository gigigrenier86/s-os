<style>
/* ═══════════════════════════════════════════════════════════════════
   CONSTELLATION — le bureau de S

   Les applications sont des spheres. Chacune porte SON icone, et son
   anneau dit d'ou elle vient :
       rouge  Linux      bleu  Windows      vert  Android
   On reconnait l'application avant de lire son nom.

   Un anneau PLEIN = le logiciel a deja tourne, mesure.
   Un anneau POINTILLE = il est pose dans l'image, jamais exerce.
   C'est la discipline du carnet, rendue visible sans un mot.

   2026-08-22 -- les etoiles sont MODULABLES et FUSIONNABLES :

   Une etoile GROSSIT avec l'usage. Chaque lancement compte, l'echelle
   est logarithmique et relative au plus utilise, bornee 30 a 60 px :
   la hierarchie se voit, rien ne devient illisible. Le compte vit
   dans le navigateur (localStorage) ; sur le vrai S il viendra de
   kactivitymanagerd, qui note deja chaque lancement dans
   ~/.local/share/kactivitymanagerd/resources/database.

   Un DOUBLE-CLIC OUVRE LA CIBLE, directement et sans residu :
   quand la cible reelle est une page web (RapidO -> MEWS, Gemini,
   F-Droid...), elle s'ouvre aussitot. Sur le vrai S, le meme geste
   executera le binaire. Aucune fenetre intermediaire.

   Deux etoiles GLISSEES l'une sur l'autre FUSIONNENT en un amas.
   L'anneau de l'amas garde les couleurs des mondes qu'il contient --
   la fusion reste lisible, on ne perd jamais d'ou vient quoi.
   Double-clic sur l'amas : il se defait.
   ═══════════════════════════════════════════════════════════════════ */

:root {
  --linux:    #ff4d4d;
  --windows:  #4da6ff;
  --android:  #4dff88;

  --espace:   #050510;
  --verre:    rgba(12, 12, 20, 0.86);
  --verre-2:  rgba(255, 255, 255, 0.045);
  --bord:     rgba(255, 255, 255, 0.09);
  --bord-vif: rgba(255, 255, 255, 0.22);
  --texte:    #eef0f6;
  --texte-2:  rgba(238, 240, 246, 0.62);
  --texte-3:  rgba(238, 240, 246, 0.34);
  --lien:     rgba(255, 255, 255, 0.16);
  --lien-vif: rgba(255, 255, 255, 0.55);

  --rayon:    12px;
  --sphere:   40px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  width: 100%; height: 100%;
  background: var(--espace);
  color: var(--texte);
  font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  overflow: hidden;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

#fond, #liens { position: fixed; inset: 0; display: block; }
#fond  { z-index: 0; }
#liens { z-index: 1; pointer-events: none; }

#scene { position: fixed; inset: 0; z-index: 2; }

/* ── Les spheres ───────────────────────────────────────────────── */
.astre {
  position: absolute;
  --d: var(--sphere);              /* le diametre, module par l'usage */
  width: var(--d); height: var(--d);
  margin: calc(var(--d) / -2) 0 0 calc(var(--d) / -2);
  border-radius: 50%;
  display: grid; place-items: center;
  cursor: grab;
  z-index: 10;
  /* Une sphere, pas un disque : le degre radial decale donne le volume. */
  background:
    radial-gradient(circle at 34% 30%,
      rgba(255,255,255,0.16) 0%,
      rgba(255,255,255,0.04) 38%,
      rgba(0,0,0,0.55) 100%),
    #0b0b14;
  border: 2px solid var(--teinte);
  box-shadow: 0 0 0 0 transparent, inset 0 0 12px rgba(0,0,0,0.7);
  transition: transform 180ms cubic-bezier(.2,.8,.2,1), box-shadow 180ms ease,
              width 300ms cubic-bezier(.2,.8,.2,1), height 300ms cubic-bezier(.2,.8,.2,1),
              margin 300ms cubic-bezier(.2,.8,.2,1);
}
.astre:active { cursor: grabbing; }
.astre.pose   { border-style: dashed; }          /* pose, jamais exerce */
.astre:hover  { transform: scale(1.16); }
.astre:hover, .astre.choisi { box-shadow: 0 0 18px var(--halo), inset 0 0 12px rgba(0,0,0,0.7); }
.astre.choisi { transform: scale(1.22); border-width: 2.5px; }
.astre:focus-visible { outline: 2px solid var(--texte); outline-offset: 4px; }

/* Un amas : des etoiles fusionnees. Son anneau est un arc par monde
   present, aux couleurs des mondes -- la fusion ne cache rien. */
.astre.amas { border-color: transparent; }
.astre.amas::before {
  content: ""; position: absolute; inset: -2px; border-radius: 50%;
  background: var(--anneau, conic-gradient(var(--bord-vif) 0deg 360deg));
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.4px));
  mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.4px));
  pointer-events: none;
}
.astre .compte {
  position: absolute; right: -5px; top: -5px;
  min-width: 16px; height: 16px; padding: 0 4px;
  border-radius: 999px;
  background: var(--verre); border: 1px solid var(--bord-vif);
  color: var(--texte); font-size: 9.5px; line-height: 14px;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  text-align: center; pointer-events: none;
}

.astre svg { width: calc(var(--d) * 0.47); height: calc(var(--d) * 0.47); fill: none; stroke: var(--teinte);
             stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
             pointer-events: none; }

.etiquette {
  position: absolute; top: calc(100% + 8px); left: 50%;
  transform: translateX(-50%);
  font-size: 11px; letter-spacing: 0.02em; white-space: nowrap;
  color: var(--texte-2); pointer-events: none;
  opacity: 0; transition: opacity 160ms ease;
  text-shadow: 0 1px 6px rgba(0,0,0,0.9);
}
.astre:hover .etiquette, .astre.choisi .etiquette, body.noms .etiquette { opacity: 1; }

/* ── La barre du bas ───────────────────────────────────────────── */
#barre {
  position: fixed; left: 50%; bottom: 22px;
  transform: translateX(-50%);
  z-index: 60;
  display: flex; align-items: center; gap: 10px;
  padding: 7px 9px;
  background: var(--verre);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--bord);
  border-radius: 999px;
}

#noyau {
  width: 42px; height: 42px; border-radius: 50%;
  border: 1px solid var(--bord-vif);
  background: radial-gradient(circle at 50% 45%, #33333f 0%, #07070f 78%);
  display: grid; place-items: center;
  cursor: pointer; flex: none;
  transition: box-shadow 260ms ease, transform 260ms ease;
}
#noyau:hover, #noyau.ouvert { box-shadow: 0 0 22px rgba(255,255,255,0.28); transform: scale(1.05); }
#noyau .etoile {
  width: 9px; height: 9px; border-radius: 50%;
  background: #fff; box-shadow: 0 0 12px #fff, 0 0 26px rgba(255,255,255,0.5);
}

.raccourci {
  width: 34px; height: 34px; border-radius: 50%;
  border: 1.5px solid var(--teinte);
  background: radial-gradient(circle at 34% 30%, rgba(255,255,255,0.14), rgba(0,0,0,0.5));
  display: grid; place-items: center; cursor: pointer; flex: none;
  transition: box-shadow 160ms ease, transform 160ms ease;
}
.raccourci:hover { transform: translateY(-3px); box-shadow: 0 0 14px var(--halo); }
.raccourci svg { width: 16px; height: 16px; fill: none; stroke: var(--teinte);
                 stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

#horloge {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 12px; font-variant-numeric: tabular-nums;
  color: var(--texte-2); padding: 0 12px 0 6px; letter-spacing: 0.04em;
}

/* ── Le menu Demarrer ──────────────────────────────────────────── */
#menu {
  position: fixed; left: 50%; bottom: 84px;
  transform: translateX(-50%) translateY(14px) scale(0.985);
  width: min(560px, calc(100vw - 32px));
  max-height: min(640px, calc(100vh - 130px));
  z-index: 70;
  display: flex; flex-direction: column;
  background: var(--verre);
  backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
  border: 1px solid var(--bord);
  border-radius: var(--rayon);
  box-shadow: 0 24px 70px rgba(0,0,0,0.65);
  opacity: 0; pointer-events: none;
  transition: opacity 220ms ease, transform 220ms cubic-bezier(.2,.8,.2,1);
  overflow: hidden;
}
#menu.ouvert { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0) scale(1); }

#tete { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; }
#recherche {
  flex: 1; height: 34px; padding: 0 12px;
  background: var(--verre-2); border: 1px solid var(--bord);
  border-radius: 8px; color: var(--texte);
  font: inherit; font-size: 13px; outline: none;
}
#recherche::placeholder { color: var(--texte-3); }
#recherche:focus { border-color: var(--bord-vif); }

#onglets { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--bord); }
.onglet {
  appearance: none; background: none; border: none; color: var(--texte-3);
  font: inherit; font-size: 12px; padding: 9px 12px 10px; cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  display: flex; align-items: center; gap: 7px;
}
.onglet svg { width: 14px; height: 14px; fill: none; stroke: currentColor;
              stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.onglet:hover { color: var(--texte-2); }
.onglet.actif { color: var(--texte); border-bottom-color: var(--texte); }

#corps { overflow-y: auto; padding: 14px 16px 18px; scrollbar-width: thin; }
#corps::-webkit-scrollbar { width: 8px; }
#corps::-webkit-scrollbar-thumb { background: var(--bord); border-radius: 4px; }

.section-titre {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--texte-3); margin: 4px 0 10px;
}
.section-titre + .section-titre, .grille + .section-titre, .liste + .section-titre { margin-top: 20px; }

.grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; }
.tuile {
  appearance: none; background: none; border: none; color: var(--texte-2);
  font: inherit; font-size: 11px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 7px;
  padding: 11px 4px 9px; border-radius: 9px;
  transition: background 140ms ease;
}
.tuile:hover, .tuile:focus-visible { background: var(--verre-2); color: var(--texte); outline: none; }
.tuile .bulle {
  width: 38px; height: 38px; border-radius: 50%;
  border: 1.5px solid var(--teinte);
  background: radial-gradient(circle at 34% 30%, rgba(255,255,255,0.14), rgba(0,0,0,0.5));
  display: grid; place-items: center;
}
.tuile .bulle.pose { border-style: dashed; }
.tuile svg { width: 17px; height: 17px; fill: none; stroke: var(--teinte);
             stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tuile .nom { text-align: center; line-height: 1.25; }

.liste { display: flex; flex-direction: column; gap: 1px; }
.rangee {
  appearance: none; background: none; border: none; color: var(--texte-2);
  font: inherit; font-size: 13px; text-align: left; cursor: pointer;
  display: flex; align-items: center; gap: 13px;
  padding: 10px 11px; border-radius: 8px;
  transition: background 140ms ease;
}
.rangee:hover, .rangee:focus-visible { background: var(--verre-2); color: var(--texte); outline: none; }
.rangee svg { width: 17px; height: 17px; flex: none; fill: none; stroke: var(--teinte, var(--texte-2));
              stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.rangee .detail { margin-left: auto; font-size: 11px; color: var(--texte-3);
                  font-family: "IBM Plex Mono", ui-monospace, monospace; }
.rangee.grave:hover { background: rgba(255, 77, 77, 0.14); color: #ffbfbf; }

/* ── Fonds d'ecran ─────────────────────────────────────────────── */
.fonds { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 9px; }
.vignette {
  appearance: none; padding: 0; cursor: pointer;
  aspect-ratio: 16 / 10; border-radius: 8px; overflow: hidden;
  border: 1.5px solid var(--bord); position: relative;
  transition: border-color 140ms ease, transform 140ms ease;
}
.vignette:hover { transform: translateY(-2px); border-color: var(--bord-vif); }
.vignette.actif { border-color: var(--texte); }
.vignette canvas { width: 100%; height: 100%; display: block; }
.vignette .titre-v {
  position: absolute; left: 0; right: 0; bottom: 0;
  font-size: 10px; padding: 4px 6px; color: var(--texte-2);
  background: linear-gradient(transparent, rgba(0,0,0,0.8));
  text-align: left;
}

.reglage { display: flex; align-items: center; gap: 12px; padding: 9px 11px; border-radius: 8px; font-size: 13px; color: var(--texte-2); }
.reglage:hover { background: var(--verre-2); }
.reglage .detail { margin-left: auto; font-size: 11px; color: var(--texte-3);
                   font-family: "IBM Plex Mono", ui-monospace, monospace; }
.bascule {
  appearance: none; width: 38px; height: 21px; border-radius: 999px;
  background: var(--verre-2); border: 1px solid var(--bord);
  position: relative; cursor: pointer; flex: none; transition: background 160ms ease;
}
.bascule::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 15px; height: 15px; border-radius: 50%; background: var(--texte-3);
  transition: transform 160ms cubic-bezier(.2,.8,.2,1), background 160ms ease;
}
.bascule:checked { background: rgba(77, 166, 255, 0.28); border-color: var(--windows); }
.bascule:checked::after { transform: translateX(17px); background: var(--windows); }

/* ── Fiche de survol ───────────────────────────────────────────── */
#fiche {
  position: fixed; z-index: 80; pointer-events: none;
  opacity: 0; transform: translateY(3px);
  transition: opacity 130ms ease, transform 130ms ease;
  background: var(--verre); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--bord); border-radius: 8px;
  padding: 9px 12px 10px; max-width: 264px;
}
#fiche.vu { opacity: 1; transform: translateY(0); }
#fiche .f-nom { font-size: 13.5px; font-weight: 500; }
#fiche .f-src { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 9px;
                letter-spacing: 0.15em; text-transform: uppercase; margin-top: 2px; }
#fiche .f-txt { font-size: 11.5px; line-height: 1.45; color: var(--texte-2); margin-top: 7px;
                font-variant-numeric: tabular-nums; }

/* ── Message fugace ────────────────────────────────────────────── */
#mot {
  position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%);
  z-index: 55; pointer-events: none;
  font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px;
  color: var(--texte-2); background: var(--verre);
  border: 1px solid var(--bord); border-radius: 7px; padding: 6px 13px;
  opacity: 0; transition: opacity 240ms ease; white-space: nowrap;
}
#mot.vu { opacity: 1; }

#aide {
  position: fixed; right: 20px; bottom: 22px; z-index: 50;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 10px; line-height: 1.85; color: var(--texte-3);
  text-align: right; pointer-events: none;
}
#aide b { color: var(--texte-2); font-weight: 500; }

@media (max-width: 760px) { #aide { display: none; } #horloge { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition-duration: 1ms !important; } }
</style>

  <div><b>N</b> noms &#183; <b>R</b> liens d'origine &#183; <b>F</b> plein ecran</div>
</div>

<script>
"use strict";

/* ══════════════════════════════════════════════════════════════════
   TROIS DECISIONS D'INGENIERIE, ET ELLES TIENNENT LA PROMESSE
   "ultra-faible en consommation" :

   1. IL N'Y A AUCUNE BOUCLE D'ANIMATION. Pas un seul
      requestAnimationFrame permanent. Le canevas des liens n'est
      redessine que sur un evenement reel : on bouge une sphere, on
      cree un lien, on redimensionne. Au repos, le cout est
      exactement zero -- pas "faible", zero.

   2. LE FOND EST PEINT UNE FOIS dans son propre canevas, et n'est
      jamais retouche tant qu'on n'en change pas.

   3. LES SPHERES SONT DU DOM, pas du canevas. Le navigateur les
      compose sur le GPU sans que rien ne les redessine, et leurs
      icones restent nettes a toute densite d'ecran.
   ══════════════════════════════════════════════════════════════════ */

const SOURCES = {
  linux:   { nom: "Linux",   jeton: "--linux"   },
  windows: { nom: "Windows", jeton: "--windows" },
  android: { nom: "Android", jeton: "--android" }
};

/* Les vrais logiciels de S, avec leurs vrais chiffres. "eprouve" dit
   si le binaire a deja tourne -- l'anneau devient pointille sinon. */
const APPS = [
  { id:"vivaldi", nom:"Vivaldi",     src:"linux",   ico:"i-globe",     ep:1, epingle:1,
    txt:"8.1.4087.68 &#183; /usr/lib/opt/vivaldi &#183; 438 Mo" },
  { id:"code",    nom:"VS Code",     src:"linux",   ico:"i-code",      ep:1, epingle:1,
    txt:"1.134.0 &#183; /usr/share/code &#183; 1,1 Go" },
  { id:"term",    nom:"Terminal",    src:"linux",   ico:"i-terminal",  ep:1, epingle:1,
    txt:"Konsole &#183; le shell de la machine" },
  { id:"fichiers",nom:"Fichiers",    src:"linux",   ico:"i-dossier",   ep:1, epingle:1,
    txt:"Dolphin &#183; un seul dossier personnel pour les trois mondes" },
  { id:"claude",  nom:"Claude Code", src:"linux",   ico:"i-etincelle", ep:1, epingle:1,
    txt:"2.1.228 &#183; /usr/bin/claude &#183; depot RPM signe" },
  { id:"gemini",  nom:"Gemini CLI",  src:"linux",   ico:"i-etincelle", ep:1, epingle:0,
    txt:"0.56.0 &#183; 100 Mo &#183; entre sans verification de signature" },
  { id:"antigr",  nom:"Antigravity", src:"linux",   ico:"i-code",      ep:1, epingle:0,
    txt:"1.107.0 &#183; 682 Mo &#183; entre sans verification de signature" },
  { id:"node",    nom:"Node.js",     src:"linux",   ico:"i-boite",     ep:1, epingle:0,
    txt:"v24.18.0 &#183; npm 11.16.0" },
  { id:"retro",   nom:"RetroArch",   src:"linux",   ico:"i-manette",   ep:0, epingle:1,
    txt:"1.22.0 et 14 coeurs &#183; jamais lance" },
  { id:"zoom",    nom:"Zoom",        src:"linux",   ico:"i-video",     ep:0, epingle:0,
    txt:"/usr/lib/opt/zoom &#183; 918 Mo &#183; jamais lance" },

  { id:"lineage", nom:"Lineage 2",   src:"windows", ico:"i-manette",   ep:0, epingle:1,
    txt:"Moteur de 2003 &#183; GameGuard bloque les serveurs officiels" },
  { id:"cmd",     nom:"Invite",      src:"windows", ico:"i-terminal",  ep:1, epingle:0,
    txt:"cmd.exe &#183; execute, codes de sortie fideles" },
  { id:"notepad", nom:"Bloc-notes",  src:"windows", ico:"i-notes",     ep:0, epingle:0,
    txt:"Sort en 1 au banc &#183; a reprendre sur un vrai GPU" },
  { id:"rapido",  nom:"RapidO",      src:"windows", ico:"i-fenetre",   ep:1, epingle:1,
    txt:"MEWS en fenetre dediee &#183; neuf lignes de .desktop" },

  { id:"fdroid",  nom:"F-Droid",     src:"android", ico:"i-magasin",   ep:0, epingle:1,
    txt:"12,4 Mio &#183; empreinte GPG en dur &#183; jamais installe" },
  { id:"play",    nom:"Play Store",  src:"android", ico:"i-magasin",   ep:0, epingle:0,
    txt:"Image GAPPS &#183; exige un enregistrement humain, une fois" },
  { id:"msg",     nom:"Messages",    src:"android", ico:"i-bulle",     ep:0, epingle:1,
    txt:"Waydroid n'a jamais tourne" },
  { id:"musique", nom:"Musique",     src:"android", ico:"i-note-mus",  ep:0, epingle:0,
    txt:"Waydroid n'a jamais tourne" },
  { id:"photos",  nom:"Photos",      src:"android", ico:"i-image",     ep:0, epingle:1,
    txt:"Waydroid n'a jamais tourne" },
  { id:"tel",     nom:"Telephone",   src:"android", ico:"i-tel",       ep:0, epingle:0,
    txt:"Waydroid n'a jamais tourne" }
];

/* Les liens d'origine sont les coutures REELLES de S. */
const LIENS_ORIGINE = [
  ["code","claude"], ["code","node"], ["node","gemini"], ["code","antigr"],
  ["cmd","lineage"], ["cmd","notepad"], ["rapido","vivaldi"],
  ["fdroid","msg"], ["fdroid","photos"], ["play","musique"],
  ["fichiers","photos"], ["fichiers","term"]
];

/* -- L'usage : chaque lancement compte, l'etoile grossit -----------
   Valeurs de depart de vitrine. Sur le vrai S, le compteur est celui
   de kactivitymanagerd (KDE), qui note deja chaque lancement. Ici il
   vit dans localStorage : lancer une application la fait grossir, en
   direct et durablement. */
const USAGE_DEFAUT = { vivaldi:46, code:38, term:31, fichiers:24, claude:19,
  rapido:14, retro:9, gemini:7, node:6, cmd:5, antigr:4, msg:3, photos:3,
  zoom:2, fdroid:2, play:1, musique:1, tel:1, lineage:0, notepad:0 };
let usage = chargerUsage();
function chargerUsage() {
  try { const s = JSON.parse(localStorage.getItem("s-usage")); if (s) return s; } catch (e) {}
  return Object.assign({}, USAGE_DEFAUT);
}
function sauverUsage() { try { localStorage.setItem("s-usage", JSON.stringify(usage)); } catch (e) {} }

/* L'echelle est logarithmique et RELATIVE au plus utilise : lineaire,
   le premier ecraserait tous les autres ; bornee, rien ne devient
   ni invisible ni envahissant. */
const D_MIN = 30, D_MAX = 60;
function usageDe(a) {
  if (a.app.membres) return a.app.membres.reduce((t, m) => t + (usage[m.id] || 0), 0);
  return usage[a.app.id] || 0;
}
function habillerTailles() {
  const umax = Math.max(1, ...astres.map(usageDe));
  for (const a of astres) {
    const d = D_MIN + (D_MAX - D_MIN) * Math.log(1 + usageDe(a)) / Math.log(1 + umax);
    a.r = d / 2;
    a.el.style.setProperty("--d", Math.round(d) + "px");
  }
  tracerLiens();
}
function lancer(app) {
  usage[app.id] = (usage[app.id] || 0) + 1;
  sauverUsage();
  habillerTailles();
  if (CIBLES[app.id]) window.open(CIBLES[app.id], "_blank", "noopener");
  dire(app.nom + (app.ep ? "  —  lancee" : "  —  jamais exercee, ce serait un premier essai"));
}

/* ── Etat ──────────────────────────────────────────────────────── */
const scene = document.getElementById("scene");
const cvF = document.getElementById("fond"),  ctxF = cvF.getContext("2d");
const cvL = document.getElementById("liens"), ctxL = cvL.getContext("2d");
const fiche = document.getElementById("fiche");

let astres = [], liens = [], choisi = null, dpr = 1, L = 0, H = 0;
let fondActuel = "nebuleuse", imagePerso = null;

/* ── Fonds d'ecran, tous PEINTS, aucun fichier a telecharger ───── */
const FONDS = {
  nebuleuse: { nom: "Nebuleuse", peindre(g, w, h) {
    g.fillStyle = "#050510"; g.fillRect(0, 0, w, h);
    const taches = [
      [0.24, 0.30, 0.62, "77,110,255"], [0.76, 0.22, 0.50, "255,77,120"],
      [0.60, 0.78, 0.58, "60,220,180"], [0.12, 0.82, 0.42, "150,80,255"]
    ];
    for (const [px, py, pr, c] of taches) {
      const r = Math.max(w, h) * pr;
      const d = g.createRadialGradient(w*px, h*py, 0, w*px, h*py, r);
      d.addColorStop(0, "rgba(" + c + ",0.17)");
      d.addColorStop(0.45, "rgba(" + c + ",0.05)");
      d.addColorStop(1, "rgba(" + c + ",0)");
      g.fillStyle = d; g.fillRect(0, 0, w, h);
    }
    etoiles(g, w, h, 1);
  }},
  vide: { nom: "Espace profond", peindre(g, w, h) {
    g.fillStyle = "#050510"; g.fillRect(0, 0, w, h);
    etoiles(g, w, h, 1.25);
  }},
  aube: { nom: "Aube", peindre(g, w, h) {
    const d = g.createLinearGradient(0, h, 0, 0);
    d.addColorStop(0, "#2a1230"); d.addColorStop(0.45, "#12102a"); d.addColorStop(1, "#04040c");
    g.fillStyle = d; g.fillRect(0, 0, w, h);
    etoiles(g, w, h, 0.7);
  }},
  grille: { nom: "Grille", peindre(g, w, h) {
    g.fillStyle = "#06070d"; g.fillRect(0, 0, w, h);
    g.strokeStyle = "rgba(255,255,255,0.045)"; g.lineWidth = 1;
    g.beginPath();
    for (let x = 0; x < w; x += 46) { g.moveTo(x + .5, 0); g.lineTo(x + .5, h); }
    for (let y = 0; y < h; y += 46) { g.moveTo(0, y + .5); g.lineTo(w, y + .5); }
    g.stroke();
    const d = g.createRadialGradient(w/2, h/2, 0, w/2, h/2, Math.max(w,h)*0.7);
    d.addColorStop(0, "rgba(0,0,0,0)"); d.addColorStop(1, "rgba(0,0,0,0.75)");
    g.fillStyle = d; g.fillRect(0, 0, w, h);
  }},
  encre: { nom: "Encre", peindre(g, w, h) {
    g.fillStyle = "#0a0a0c"; g.fillRect(0, 0, w, h);
    etoiles(g, w, h, 0.5);
  }},
  trois: { nom: "Trois mondes", peindre(g, w, h) {
    g.fillStyle = "#050510"; g.fillRect(0, 0, w, h);
    const t = [["255,77,77", 0.18, 0.30], ["77,166,255", 0.50, 0.22], ["77,255,136", 0.82, 0.32]];
    for (const [c, px, py] of t) {
      const r = Math.max(w, h) * 0.52;
      const d = g.createRadialGradient(w*px, h*py, 0, w*px, h*py, r);
      d.addColorStop(0, "rgba(" + c + ",0.15)");
      d.addColorStop(0.5, "rgba(" + c + ",0.035)");
      d.addColorStop(1, "rgba(" + c + ",0)");
      g.fillStyle = d; g.fillRect(0, 0, w, h);
    }
    etoiles(g, w, h, 0.9);
  }}
};

/* Semis deterministe : un ciel qui change tout seul n'est pas un ciel. */
function etoiles(g, w, h, densite) {
  let s = 20260821;
  const al = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  const n = Math.round((w * h) / 6000 * densite);
  for (let i = 0; i < n; i++) {
    const t = al();
    g.globalAlpha = 0.14 + al() * 0.55;
    g.fillStyle = "#fff";
    g.beginPath();
    g.arc(al() * w, al() * h, t < 0.88 ? 0.6 : (t < 0.985 ? 1.0 : 1.6), 0, 6.2832);
    g.fill();
  }
  g.globalAlpha = 1;
}

function peindreFond() {
  ctxF.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (imagePerso) {
    /* On couvre sans deformer : le rapport de l'image est respecte. */
    const r = Math.max(L / imagePerso.width, H / imagePerso.height);
    const w = imagePerso.width * r, h = imagePerso.height * r;
    ctxF.fillStyle = "#000"; ctxF.fillRect(0, 0, L, H);
    ctxF.drawImage(imagePerso, (L - w) / 2, (H - h) / 2, w, h);
    ctxF.fillStyle = "rgba(5,5,16,0.42)"; ctxF.fillRect(0, 0, L, H);
  } else {
    (FONDS[fondActuel] || FONDS.nebuleuse).peindre(ctxF, L, H);
  }
}

/* ── Les spheres ───────────────────────────────────────────────── */
function creerAstre(app, x, y) {
  const el = document.createElement("div");
  el.className = "astre" + (app.ep ? "" : " pose");
  el.tabIndex = 0;
  el.style.setProperty("--teinte", "var(" + SOURCES[app.src].jeton + ")");
  el.style.setProperty("--halo", couleurSource(app.src, 0.55));
  el.style.left = x + "px"; el.style.top = y + "px";
  el.innerHTML = '<svg><use href="#' + app.ico + '"/></svg>' +
                 '<span class="etiquette">' + app.nom + "</span>";
  scene.appendChild(el);

  const a = { app, el, x, y };
  astres.push(a);
  brancher(a);
  return a;
}

function couleurSource(src, alpha) {
  const v = getComputedStyle(document.documentElement)
              .getPropertyValue(SOURCES[src].jeton).trim();
  const h = v.replace("#", "");
  const n = parseInt(h.length === 3 ? h[0]+h[0]+h[1]+h[1]+h[2]+h[2] : h, 16);
  return "rgba(" + ((n>>16)&255) + "," + ((n>>8)&255) + "," + (n&255) + "," + alpha + ")";
}

function brancher(a) {
  let bouge = false, ox = 0, oy = 0;

  a.el.addEventListener("pointerdown", e => {
    e.stopPropagation();
    a.el.setPointerCapture(e.pointerId);
    bouge = false; ox = e.clientX - a.x; oy = e.clientY - a.y;
  });

  a.el.addEventListener("pointermove", e => {
    if (!a.el.hasPointerCapture || !a.el.hasPointerCapture(e.pointerId)) return;
    const nx = e.clientX - ox, ny = e.clientY - oy;
    if (!bouge && Math.hypot(nx - a.x, ny - a.y) < 4) return;
    bouge = true;
    const marge = (a.r || 20) + 6;
    a.x = Math.max(marge, Math.min(L - marge, nx));
    a.y = Math.max(marge, Math.min(H - 70 - marge, ny));
    a.el.style.left = a.x + "px"; a.el.style.top = a.y + "px";
    tracerLiens();
  });

  a.el.addEventListener("pointerup", e => {
    e.stopPropagation();
    if (bouge) {
      bouge = false;
      const cible = astres.find(x => x !== a &&
        Math.hypot(x.x - a.x, x.y - a.y) < (x.r + a.r) * 0.62);
      if (cible) fusionner(a, cible);
      return;
    }
    choisirAstre(a);
  });

  a.el.addEventListener("dblclick", e => {
    e.stopPropagation();
    if (a.app.membres) defaire(a); else lancer(a.app);
  });

  a.el.addEventListener("pointerenter", e => montrerFiche(a, e.clientX, e.clientY));
  a.el.addEventListener("pointerleave", () => fiche.classList.remove("vu"));
  a.el.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); choisirAstre(a); }
  });
}

function choisirAstre(a) {
  if (choisi === a) { deselectionner(); dire("choix annule"); return; }
  if (!choisi) {
    choisi = a; a.el.classList.add("choisi");
    dire(a.app.nom + "  —  choisir une seconde etoile");
    return;
  }
  const deja = liens.find(l => (l.a === choisi && l.b === a) || (l.a === a && l.b === choisi));
  if (deja) dire("ce lien existe deja");
  else { liens.push({ a: choisi, b: a }); dire(choisi.app.nom + " — " + a.app.nom + "  lies"); }
  deselectionner();
  tracerLiens();
}

function deselectionner() {
  if (choisi) choisi.el.classList.remove("choisi");
  choisi = null;
}

/* -- Le double-clic ouvre la cible, sans fenetre intermediaire :
   quand la cible reelle est une page web, elle s'ouvre aussitot.
   Sur le vrai S, le meme geste executera le binaire. */
const CIBLES = {
  rapido:  "https://app.mews.com/",
  gemini:  "https://gemini.google.com/",
  vivaldi: "https://vivaldi.com/",
  code:    "https://code.visualstudio.com/",
  claude:  "https://claude.com/claude-code",
  node:    "https://nodejs.org/",
  antigr:  "https://antigravity.google/",
  retro:   "https://www.retroarch.com/",
  zoom:    "https://zoom.us/",
  fdroid:  "https://f-droid.org/",
  play:    "https://play.google.com/",
  lineage: "https://www.lineage2.com/"
};
/* ── La fusion : deux etoiles n'en font qu'une, sans rien cacher ── */
let nAmas = 0;
function membresDe(a) { return a.app.membres ? a.app.membres : [a.app]; }
function retirer(a) { astres.splice(astres.indexOf(a), 1); a.el.remove(); }

function fusionner(a, b) {
  const membres = membresDe(b).concat(membresDe(a));
  const amas = creerAmas(membres, (a.x + b.x) / 2, (a.y + b.y) / 2);
  /* Les liens des membres suivent l'amas, sans doublon ni boucle. */
  for (const l of liens) {
    if (l.a === a || l.a === b) l.a = amas;
    if (l.b === a || l.b === b) l.b = amas;
  }
  liens = liens.filter((l, i) => l.a !== l.b &&
    liens.findIndex(m => (m.a === l.a && m.b === l.b) || (m.a === l.b && m.b === l.a)) === i);
  retirer(a); retirer(b);
  deselectionner();
  habillerTailles();
  dire("amas : " + membres.map(m => m.nom).join(" + "));
}

function creerAmas(membres, x, y) {
  const gros = membres.slice().sort((m, n) => (usage[n.id] || 0) - (usage[m.id] || 0))[0];
  const mondes = [...new Set(membres.map(m => m.src))];
  const app = {
    id: "amas-" + (++nAmas),
    nom: membres.map(m => m.nom).join(" + "),
    src: gros.src, ico: gros.ico,
    ep: membres.every(m => m.ep) ? 1 : 0,
    membres,
    txt: membres.map(m => m.nom + " — " + SOURCES[m.src].nom +
                          (m.ep ? "" : " · jamais exerce")).join("<br>")
  };
  const a = creerAstre(app, x, y);
  a.el.classList.add("amas");
  /* Un arc par monde present, aux couleurs des mondes. */
  const part = 360 / mondes.length;
  a.el.style.setProperty("--anneau", "conic-gradient(from -90deg, " +
    mondes.map((s, i) => "var(" + SOURCES[s].jeton + ") " + i * part + "deg " + (i + 1) * part + "deg").join(", ") + ")");
  const c = document.createElement("span");
  c.className = "compte"; c.textContent = membres.length;
  a.el.appendChild(c);
  return a;
}

function defaire(a) {
  const membres = a.app.membres, x = a.x, y = a.y;
  liens = liens.filter(l => l.a !== a && l.b !== a);
  retirer(a);
  membres.forEach((m, i) => {
    const t = (i / membres.length) * 2 * Math.PI - Math.PI / 2;
    creerAstre(m,
      Math.max(30, Math.min(L - 30, x + Math.cos(t) * 66)),
      Math.max(30, Math.min(H - 106, y + Math.sin(t) * 66)));
  });
  habillerTailles();
  dire("amas defait");
}

/* ── Les liens : redessines UNIQUEMENT sur evenement ───────────── */
function tracerLiens() {
  ctxL.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctxL.clearRect(0, 0, L, H);
  ctxL.lineCap = "round";
  const styles = getComputedStyle(document.documentElement);
  const pale = styles.getPropertyValue("--lien").trim();
  const vif  = styles.getPropertyValue("--lien-vif").trim();
  for (const l of liens) {
    const actif = choisi && (l.a === choisi || l.b === choisi);
    ctxL.strokeStyle = actif ? vif : pale;
    ctxL.lineWidth = actif ? 1.2 : 0.8;
    ctxL.beginPath();
    ctxL.moveTo(l.a.x, l.a.y);
    ctxL.lineTo(l.b.x, l.b.y);
    ctxL.stroke();
  }
}

function lienSous(x, y) {
  for (const l of liens) {
    const dx = l.b.x - l.a.x, dy = l.b.y - l.a.y;
    const d2 = dx*dx + dy*dy;
    if (d2 < 1) continue;
    let u = ((x - l.a.x) * dx + (y - l.a.y) * dy) / d2;
    u = Math.max(0, Math.min(1, u));
    if (Math.hypot(l.a.x + u*dx - x, l.a.y + u*dy - y) < 7) return l;
  }
  return null;
}

/* ── Fiche et message ──────────────────────────────────────────── */
function montrerFiche(a, x, y) {
  fiche.querySelector(".f-nom").textContent = a.app.nom;
  const s = fiche.querySelector(".f-src");
  if (a.app.membres) {
    const mondes = [...new Set(a.app.membres.map(m => m.src))];
    s.textContent = "amas  ·  " + mondes.map(m => SOURCES[m].nom).join(" + ");
    s.style.color = "var(--texte-2)";
  } else {
    const u = usage[a.app.id] || 0;
    s.textContent = SOURCES[a.app.src].nom + (a.app.ep ? "" : "  ·  jamais exerce") +
                    "  ·  " + u + (u > 1 ? " lancements" : " lancement");
    s.style.color = "var(" + SOURCES[a.app.src].jeton + ")";
  }
  fiche.querySelector(".f-txt").innerHTML = a.app.txt;
  fiche.classList.add("vu");
  const b = fiche.getBoundingClientRect();
  let fx = x + 22, fy = y + 16;
  if (fx + b.width  > L - 12) fx = x - b.width - 22;
  if (fy + b.height > H - 12) fy = y - b.height - 16;
  fiche.style.left = Math.max(12, fx) + "px";
  fiche.style.top  = Math.max(12, fy) + "px";
}

let tMot = 0;
function dire(t) {
  const m = document.getElementById("mot");
  m.textContent = t; m.classList.add("vu");
  clearTimeout(tMot);
  tMot = setTimeout(() => m.classList.remove("vu"), 2100);
}

/* ── Mise en place ─────────────────────────────────────────────── */
function semer() {
  scene.innerHTML = "";
  astres = []; liens = []; choisi = null;
  const cx = L / 2, cy = (H - 70) / 2;
  const R = Math.min(L, H - 70) * 0.34;
  const secteurs = { linux: -Math.PI/2, windows: Math.PI/6, android: Math.PI*5/6 };
  const parSrc = { linux: [], windows: [], android: [] };
  APPS.forEach(a => parSrc[a.src].push(a));

  for (const src in parSrc) {
    const g = parSrc[src];
    g.forEach((app, i) => {
      const a = secteurs[src] + (i / Math.max(1, g.length - 1) - 0.5) * 1.18;
      const d = R * (0.55 + 0.45 * ((i * 0.61803) % 1));
      creerAstre(app, cx + Math.cos(a) * d, cy + Math.sin(a) * d * 0.88);
    });
  }
  rendreLiensOrigine();
  habillerTailles();
}

function parId(id) { return astres.find(a => a.app.id === id); }

function rendreLiensOrigine() {
  liens = LIENS_ORIGINE.map(([x, y]) => ({ a: parId(x), b: parId(y) }))
                       .filter(l => l.a && l.b);
  tracerLiens();
}

function redimensionner() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  L = window.innerWidth; H = window.innerHeight;
  for (const c of [cvF, cvL]) {
    c.width = L * dpr; c.height = H * dpr;
    c.style.width = L + "px"; c.style.height = H + "px";
  }
  peindreFond();
  if (!astres.length) semer(); else tracerLiens();
}

/* ── Le menu Demarrer ──────────────────────────────────────────── */
const menu = document.getElementById("menu");
const noyau = document.getElementById("noyau");
const corps = document.getElementById("corps");
const recherche = document.getElementById("recherche");
let vue = "apps";

function ouvrirMenu(o) {
  menu.classList.toggle("ouvert", o);
  noyau.classList.toggle("ouvert", o);
  if (o) { recherche.value = ""; peindreVue(); setTimeout(() => recherche.focus(), 60); }
}
noyau.addEventListener("click", () => ouvrirMenu(!menu.classList.contains("ouvert")));
noyau.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); ouvrirMenu(!menu.classList.contains("ouvert")); }
});

document.querySelectorAll(".onglet").forEach(o => {
  o.addEventListener("click", () => {
    document.querySelectorAll(".onglet").forEach(x => x.classList.remove("actif"));
    o.classList.add("actif");
    vue = o.dataset.vue;
    peindreVue();
  });
});

recherche.addEventListener("input", peindreVue);

function bulleHTML(app, cls) {
  return '<span class="' + cls + (app.ep ? "" : " pose") + '" style="--teinte:var(' +
         SOURCES[app.src].jeton + ')"><svg><use href="#' + app.ico + '"/></svg></span>';
}

function peindreVue() {
  const q = recherche.value.trim().toLowerCase();
  let h = "";

  if (q) {
    const trouves = APPS.filter(a => a.nom.toLowerCase().includes(q) ||
                                     SOURCES[a.src].nom.toLowerCase().includes(q));
    h += '<div class="section-titre">' + trouves.length + " resultat(s)</div>";
    h += trouves.length
       ? '<div class="grille">' + trouves.map(tuile).join("") + "</div>"
       : '<div class="reglage">Rien ne correspond a &laquo; ' + q + " &raquo;.</div>";
    corps.innerHTML = h; brancherMenu(); return;
  }

  if (vue === "apps") {
    h += '<div class="section-titre">Epinglees</div><div class="grille">' +
         APPS.filter(a => a.epingle).map(tuile).join("") + "</div>";
    for (const src of ["linux", "windows", "android"]) {
      h += '<div class="section-titre">' + SOURCES[src].nom + "</div><div class=\"grille\">" +
           APPS.filter(a => a.src === src).map(tuile).join("") + "</div>";
    }
  }

  else if (vue === "dossiers") {
    const d = [
      ["i-maison",  "Dossier personnel", "/var/home/Ghis"],
      ["i-doc",     "Documents",         "un seul, pour les trois mondes"],
      ["i-image",   "Images",            ""],
      ["i-telech",  "Telechargements",   ""],
      ["i-note-mus","Musique",           ""],
      ["i-video",   "Videos",            ""],
      ["i-disque",  "Seagate",           "4,55 To"],
      ["i-boite",   "Le Windows de S",   "prefixe Proton"]
    ];
    h += '<div class="section-titre">Emplacements</div><div class="liste">' +
      d.map(([i, n, det]) =>
        '<button class="rangee"><svg><use href="#' + i + '"/></svg>' + n +
        (det ? '<span class="detail">' + det + "</span>" : "") + "</button>").join("") +
      "</div>";
  }

  else if (vue === "reglages") {
    h += '<div class="section-titre">Fond d\'ecran</div><div class="fonds" id="fonds"></div>';
    h += '<div class="section-titre">Depuis un fichier</div><div class="liste">' +
         '<button class="rangee" data-act="image"><svg><use href="#i-image"/></svg>' +
         'Choisir une image&#8230;<span class="detail">jamais envoyee</span></button></div>';
    h += '<div class="section-titre">Bureau</div><div class="liste">' +
      '<label class="reglage"><svg style="width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7"><use href="#i-notes"/></svg>' +
      'Noms toujours visibles<input type="checkbox" class="bascule" id="b-noms" style="margin-left:auto"></label>' +
      '<button class="rangee" data-act="liens"><svg><use href="#i-recommence"/></svg>' +
      'Rendre les liens d\'origine<span class="detail">' + LIENS_ORIGINE.length + " coutures</span></button>" +
      '<button class="rangee" data-act="ranger"><svg><use href="#i-grille"/></svg>' +
      'Ranger les etoiles</button>' +
      "</div>";
    h += '<div class="section-titre">Systeme</div><div class="liste">' +
      '<button class="rangee"><svg><use href="#i-ecran"/></svg>Affichage<span class="detail">' +
        window.innerWidth + "&#215;" + window.innerHeight + "</span></button>" +
      '<button class="rangee"><svg><use href="#i-son"/></svg>Son</button>' +
      '<button class="rangee"><svg><use href="#i-reseau"/></svg>Reseau</button>' +
      '<button class="rangee"><svg><use href="#i-boite"/></svg>A propos<span class="detail">S</span></button>' +
      "</div>";
  }

  else if (vue === "alim") {
    h += '<div class="section-titre">Session</div><div class="liste">' +
      '<button class="rangee"><svg><use href="#i-cadenas"/></svg>Verrouiller</button>' +
      '<button class="rangee"><svg><use href="#i-sortie"/></svg>Se deconnecter</button>' +
      "</div>";
    h += '<div class="section-titre">Machine</div><div class="liste">' +
      '<button class="rangee"><svg><use href="#i-recommence"/></svg>Redemarrer</button>' +
      '<button class="rangee grave"><svg><use href="#i-alim"/></svg>Eteindre</button>' +
      "</div>";
  }

  corps.innerHTML = h;
  if (vue === "reglages" && !q) peindreVignettes();
  brancherMenu();
}

function tuile(app) {
  return '<button class="tuile" data-app="' + app.id + '">' +
         bulleHTML(app, "bulle") + '<span class="nom">' + app.nom + "</span></button>";
}

function peindreVignettes() {
  const hote = document.getElementById("fonds");
  if (!hote) return;
  hote.innerHTML = "";
  for (const cle in FONDS) {
    const b = document.createElement("button");
    b.className = "vignette" + (cle === fondActuel && !imagePerso ? " actif" : "");
    b.dataset.fond = cle;
    const c = document.createElement("canvas");
    c.width = 208; c.height = 130;
    FONDS[cle].peindre(c.getContext("2d"), 208, 130);
    b.appendChild(c);
    const t = document.createElement("span");
    t.className = "titre-v"; t.textContent = FONDS[cle].nom;
    b.appendChild(t);
    hote.appendChild(b);
  }
}

function brancherMenu() {
  corps.querySelectorAll("[data-app]").forEach(b => {
    b.addEventListener("click", () => {
      const app = APPS.find(a => a.id === b.dataset.app);
      lancer(app);
      ouvrirMenu(false);
    });
  });
  corps.querySelectorAll("[data-fond]").forEach(b => {
    b.addEventListener("click", () => {
      fondActuel = b.dataset.fond; imagePerso = null;
      peindreFond(); peindreVignettes();
      dire("fond : " + FONDS[fondActuel].nom);
    });
  });
  const bn = document.getElementById("b-noms");
  if (bn) {
    bn.checked = document.body.classList.contains("noms");
    bn.addEventListener("change", () => document.body.classList.toggle("noms", bn.checked));
  }
  corps.querySelectorAll("[data-act]").forEach(b => {
    b.addEventListener("click", () => {
      const a = b.dataset.act;
      if (a === "liens")  { rendreLiensOrigine(); dire("liens d'origine rendus"); }
      if (a === "ranger") { semer(); dire("etoiles rangees"); }
      if (a === "image")  { choisirImage(); }
    });
  });
}

/* Le fichier est lu DANS le navigateur, jamais envoye nulle part. */
function choisirImage() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*";
  inp.addEventListener("change", () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const lec = new FileReader();
    lec.onload = () => {
      const im = new Image();
      im.onload = () => {
        imagePerso = im; peindreFond(); peindreVignettes();
        dire("fond : " + f.name);
      };
      im.onerror = () => dire("cette image n'a pas pu etre lue");
      im.src = lec.result;
    };
    lec.readAsDataURL(f);
  });
  inp.click();
}

/* ── Clic sur le vide : effacer un lien, ou fermer le menu ─────── */
document.addEventListener("pointerdown", e => {
  if (menu.contains(e.target) || noyau.contains(e.target)) return;
  if (menu.classList.contains("ouvert")) { ouvrirMenu(false); return; }
  if (e.target.closest(".astre") || e.target.closest("#barre")) return;
  const l = lienSous(e.clientX, e.clientY);
  if (l) { liens.splice(liens.indexOf(l), 1); tracerLiens(); dire("lien efface"); }
  else if (choisi) { deselectionner(); tracerLiens(); dire("choix annule"); }
});

addEventListener("keydown", e => {
  if (e.target === recherche) { if (e.key === "Escape") ouvrirMenu(false); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "escape") { if (menu.classList.contains("ouvert")) ouvrirMenu(false); else { deselectionner(); tracerLiens(); } }
  else if (k === "n") { document.body.classList.toggle("noms"); dire(document.body.classList.contains("noms") ? "noms visibles" : "noms au survol"); }
  else if (k === "r") { rendreLiensOrigine(); dire("liens d'origine rendus"); }
  else if (k === "f") {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => dire("plein ecran refuse"));
  }
});

addEventListener("resize", redimensionner);

/* ── La barre : les epinglees, plus l'heure ────────────────────── */
function peindreBarre() {
  const r = document.getElementById("raccourcis");
  r.innerHTML = "";
  APPS.filter(a => a.epingle).slice(0, 7).forEach(app => {
    const b = document.createElement("button");
    b.className = "raccourci";
    b.style.setProperty("--teinte", "var(" + SOURCES[app.src].jeton + ")");
    b.style.setProperty("--halo", couleurSource(app.src, 0.5));
    b.title = app.nom;
    b.innerHTML = '<svg><use href="#' + app.ico + '"/></svg>';
    b.addEventListener("click", () => lancer(app));
    r.appendChild(b);
  });
}

function horloge() {
  const d = new Date();
  document.getElementById("horloge").textContent =
    String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

/* ── Depart ────────────────────────────────────────────────────── */
redimensionner();
peindreBarre();
horloge();
setInterval(horloge, 20000);   /* la seule minuterie de la page */
setTimeout(() => dire("les etoiles grossissent avec l'usage — glisser l'une sur l'autre pour fusionner"), 900);
</script>
