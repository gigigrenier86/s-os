# Construit l'image de S et la publie sur ghcr.io.
#
# Pourquoi le CI et pas la machine : elle n'a ni podman ni WSL, et il ne lui
# reste que ~61 Go libres. Faire construire ailleurs regle les deux d'un coup.

name: Construire S

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LISEZ-MOI*'
      # L'atelier ISO ne change rien a l'image : le reconstruire pour une
      # virgule corrigee dans iso.yml coute neuf minutes pour rien.
      - '.github/workflows/iso.yml'
      # Le banc tourne sur la machine, jamais dans l'image.
      - 'banc/**'
      # Le Grimoire non plus : ce sont des recettes qu'on « source » a la main,
      # aucun COPY ne les emporte. Verifie le 2026-08-25 sur le Containerfile.
      #
      # ATTENTION, ET C'EST POURQUOI GALERIE/ N'EST PAS ICI : la Galerie, elle,
      # ENTRE dans l'image — « COPY galerie/foudre-gelee/foudre-gelee.png » et
      # son pendant pour l'ecran de connexion. L'ignorer empecherait la
      # reconstruction le jour ou le fond d'ecran change, et personne ne le
      # verrait avant de regarder l'ecran de connexion d'une machine neuve.
      - 'grimoire/**'
  pull_request:
  schedule:
    # Bazzite publie tous les jours. Sans reconstruction reguliere, l'image de S
    # derive lentement de sa base et finit par ne plus rien prouver.
    - cron: '30 5 * * *'
  workflow_dispatch:

env:
  IMAGE_NAME: s-os

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # « id-token » sert UNIQUEMENT a la signature sans cle : GitHub delivre au
      # job un jeton OIDC que Sigstore echange contre un certificat ephemere.
      # Aucun secret de depot n'est requis, donc rien a poser a la main.
      id-token: write

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Controler le contexte avant de telecharger dix gigaoctets
        # Une source de COPY absente ne se voit qu'au moment du COPY, c'est-a-dire
        # APRES le telechargement complet de l'image de base : quatre minutes
        # perdues pour une faute qui se lit en une seconde. Le cas s'est produit
        # des la premiere construction — git ne suit pas les dossiers vides, et
        # « files/ » n'etait jamais entre dans le depot.
        run: |
          manque=0
          for src in $(grep -E '^[[:space:]]*COPY[[:space:]]' Containerfile | awk '{print $2}'); do
            if [ -e "$src" ]; then
              echo "  present : $src"
            else
              echo "  ABSENT DU CONTEXTE : $src"
              manque=1
            fi
          done
          for f in build_files/*.sh; do
            head -c2 "$f" | grep -q '#!' || { echo "  SANS SHEBANG : $f"; manque=1; }
            bash -n "$f" || { echo "  SYNTAXE CASSEE : $f"; manque=1; }
          done
          # LE TROUSSEAU DE F-DROID N'EST PAS UN COPY : 40-coutures.sh le lit
          # dans /ctx. Son absence ne se verrait donc pas dans la boucle
          # ci-dessus — elle se verrait neuf minutes plus tard, au moment ou la
          # verification de signature en a besoin.
          if [ -s build_files/cles/f-droid.asc ]; then
            echo "  present : build_files/cles/f-droid.asc"
          else
            echo "  ABSENT DU CONTEXTE : build_files/cles/f-droid.asc"
            manque=1
          fi
          # LES CONTROLES PAR MOTIF, REJOUES CONTRE LES FICHIERS REELS.
          #
          # Un script de construction qui cherche une chaine dans un fichier de
          # l'image se desynchronise des qu'on reecrit ce fichier — et la
          # construction tombe NEUF MINUTES plus tard, sur une faute qui se lit
          # ici en deux secondes.
          #
          # Vecu le 2026-08-26 : le geste appelait
          # « "$S_GESTES/s-lien-windows" --recenser » quand le controle cherchait
          # « s-lien-windows --recenser ». Un guillemet fermant au milieu, et la
          # sous-chaine n'existait plus.
          #
          # La recette complete, avec ce qu'elle ne voit pas :
          # grimoire/construction-eprouver-les-motifs.sh
          while IFS= read -r ligne; do
            motif=$(printf '%s' "$ligne" | sed -E "s/.*'([^']+)'.*/\1/")
            cible=$(printf '%s' "$ligne" | grep -oE '/usr/(bin|lib|share|libexec)/[^ ;]+')
            drapeaux=$(printf '%s' "$ligne" | grep -oE 'grep -q[a-zA-Z]*' | sed 's/grep -q//')
            [ -f "files$cible" ] || continue
            if grep -q${drapeaux} -- "$motif" "files$cible" 2>/dev/null; then
              echo "  motif OK : $(basename "$cible")"
            else
              echo "  MOTIF PERIME : $cible ne contient plus « $motif »"
              manque=1
            fi
          done < <(grep -hoE "grep -q[a-zA-Z]* (--)? *'[^']+' +/usr/(bin|lib|share|libexec)/[^ ;]+" \
                       build_files/*.sh 2>/dev/null | sort -u)

          if [ "$manque" -ne 0 ]; then
            echo "Contexte incomplet — on n'engage pas le telechargement." >&2
            exit 1
          fi
          echo "OK : contexte complet, scripts valides, motifs a jour."

      - name: Faire de la place
        # Bazzite est une image volumineuse et un runner GitHub est etroit.
        # Sans cette etape, la construction meurt sur « no space left on device »
        # apres plusieurs minutes de telechargement — echec tardif et opaque.
        run: |
          echo "=== Avant ===" && df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      /opt/hostedtoolcache || true
          sudo docker image prune --all --force || true
          echo "=== Apres ===" && df -h /

      - name: Construire l'image
        run: |
          # LES ETIQUETTES, ET POURQUOI ELLES ONT ETE AJOUTEES LE 2026-08-26.
          #
          # Le Containerfile n'en posait AUCUNE : l'image heritait entierement
          # de celles de Bazzite. Releve ce jour-la sur l'image publiee, alors
          # que son manifeste venait d'etre construit :
          #
          #   org.opencontainers.image.revision = 75cf7fe1...  <- pas un commit de S
          #   org.opencontainers.image.created  = 2026-08-25T23:59:43Z
          #   org.opencontainers.image.version  = 44.20260825
          #   (manifeste reellement construit le 2026-08-26 a 11 h 02 UTC)
          #
          # CE QUE CA COUTAIT : l'image ne pouvait pas dire de quel commit elle
          # venait. Le matin meme, repondre a « est-ce que l'image porte bien ce
          # que le depot contient ? » a demande de comparer 75 fichiers un par
          # un. Une etiquette y repond en une commande. Et « bootc status »
          # affichait la MEME version pour l'image demarree et pour celle de
          # repli, alors que leurs condensats different.
          #
          # La version porte le jour ET le commit court : elle bouge donc a
          # chaque construction, ce que « 44.20260825 » ne faisait pas.
          VERSION="44.$(date -u +%Y%m%d).$(git rev-parse --short HEAD)"
          echo "Version de cette image : $VERSION"
          podman build \
            --tag "${IMAGE_NAME}:${GITHUB_SHA}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.title=S" \
            --file Containerfile \
            .

      - name: Verifier que l'image est amorcable
        # Une image qui se construit n'est pas forcement une image qui demarre.
        # Ce controle attrape les manques evidents avant qu'ils coutent un
        # demarrage rate sur du vrai materiel.
        run: |
          podman run --rm "${IMAGE_NAME}:${GITHUB_SHA}" \
            bash -c 'test -x /usr/bin/waydroid-launcher \
                     && test -d /usr/lib/modules \
                     && echo "OK : Waydroid present, noyau present"'

      - name: Se connecter a ghcr.io
        if: github.event_name != 'pull_request'
        run: |
          podman login ghcr.io \
            -u "${{ github.actor }}" \
            -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Publier l'image
        if: github.event_name != 'pull_request'
        run: |
          # ghcr.io n'accepte que des minuscules ; un nom de compte GitHub peut
          # porter des majuscules.
          REG="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          for tag in latest "${GITHUB_SHA}"; do
            podman tag "${IMAGE_NAME}:${GITHUB_SHA}" "${REG}/${IMAGE_NAME}:${tag}"
            # Le condensat est releve A LA POUSSEE, pas redemande apres coup :
            # c'est celui du manifeste qui vient d'etre accepte par le registre,
            # et c'est lui que la signature doit designer. Les deux etiquettes
            # portent la meme image, donc le meme condensat.
            podman push --digestfile "${RUNNER_TEMP}/condensat" "${REG}/${IMAGE_NAME}:${tag}"
          done
          echo "Publie : ${REG}/${IMAGE_NAME}:latest @ $(cat "${RUNNER_TEMP}/condensat")"
          echo ""
          echo "Pour basculer une installation Bazzite sur cette image :"
          echo "  sudo bootc switch --enforce-container-sigpolicy=false ${REG}/${IMAGE_NAME}:latest"

      # ======================================================================
      # SIGNER — et pourquoi c'est ici que ca se repare
      # ======================================================================
      # LE CONSTAT, MESURE LE 2026-08-25 PUIS REPRIS LE 2026-08-26 :
      #
      #   rpm-ostree status  ->  ostree-unverified-registry:ghcr.io/.../s-os
      #
      # et /etc/containers/policy.json, herite de Bazzite, verifie par sigstore
      # « ghcr.io/ublue-os » mais retombe sur « insecureAcceptAnything » pour
      # tout le reste — donc pour S. L'ironie etait mesurable : S verifiait son
      # amont plus severement que lui-meme.
      #
      # CE QUI L'A REND URGENT, RELEVE LE 2026-08-26 : « uupd.timer » est ACTIF
      # sur la machine et tire « ghcr.io/gigigrenier86/s-os:latest » toutes les
      # nuits vers 04 h 06, sans que personne decide. Une garantie absente sur
      # une image qu'on installe a la main est une dette ; sur une image qui
      # s'installe toute seule pendant qu'on dort, c'en est une autre.
      #
      # SANS CLE, ET CE N'EST PAS UN RACCOURCI. La signature « keyless » de
      # Sigstore echange le jeton OIDC du job contre un certificat de courte
      # duree qui porte l'identite du workflow, et journalise le tout dans
      # Rekor. Il n'y a donc aucune cle privee a garder, a poser en secret de
      # depot, ni a faire tourner — et l'identite prouvee (« ce depot, ce
      # workflow, cette branche ») est plus precise qu'une cle partagee.
      #
      # CE QUE CETTE ETAPE NE FAIT PAS, ET C'EST VOULU : elle ne touche pas a
      # policy.json de la machine. Signer et EXIGER la signature sont deux
      # decisions ; la seconde peut empecher un demarrage ou une mise a jour et
      # se prend en connaissance de cause. Elle est ecrite dans CLAUDE.md avec
      # la commande qui la verifierait d'abord.
      #
      # ET SI CETTE ETAPE ECHOUE : l'image est DEJA publiee — la construction
      # rougit, la machine garde son image. On perd la signature, pas le
      # systeme.
      - name: Installer cosign
        if: github.event_name != 'pull_request'
        # L'outil de l'amont Sigstore, celui que le gabarit ublue-os emploie.
        uses: sigstore/cosign-installer@v3

      - name: Signer l'image publiee
        if: github.event_name != 'pull_request'
        run: |
          REG="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          CONDENSAT="$(cat "${RUNNER_TEMP}/condensat")"
          # On signe le CONDENSAT, jamais l'etiquette : « latest » designera
          # autre chose demain, le condensat designe cette image-la pour
          # toujours.
          cosign sign --yes "${REG}/${IMAGE_NAME}@${CONDENSAT}"
          echo "Signe : ${REG}/${IMAGE_NAME}@${CONDENSAT}"
          echo ""
          echo "Pour verifier depuis n'importe quelle machine :"
          echo "  cosign verify ${REG}/${IMAGE_NAME}:latest \\"
          echo "    --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \\"
          echo "    --certificate-oidc-issuer https://token.actions.githubusercontent.com"
