# Construit l'image de S et la publie sur ghcr.io.
#
# Pourquoi le CI et pas la machine : elle n'a ni podman ni WSL, et il ne lui
# reste que ~61 Go libres. Faire construire ailleurs regle les deux d'un coup.

name: Construire S

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LISEZ-MOI*'
  pull_request:
  schedule:
    # Bazzite publie tous les jours. Sans reconstruction reguliere, l'image de S
    # derive lentement de sa base et finit par ne plus rien prouver.
    - cron: '30 5 * * *'
  workflow_dispatch:

env:
  IMAGE_NAME: s-os

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Faire de la place
        # Bazzite est une image volumineuse et un runner GitHub est etroit.
        # Sans cette etape, la construction meurt sur « no space left on device »
        # apres plusieurs minutes de telechargement — echec tardif et opaque.
        run: |
          echo "=== Avant ===" && df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      /opt/hostedtoolcache || true
          sudo docker image prune --all --force || true
          echo "=== Apres ===" && df -h /

      - name: Construire l'image
        run: |
          podman build \
            --tag "${IMAGE_NAME}:${GITHUB_SHA}" \
            --file Containerfile \
            .

      - name: Verifier que l'image est amorcable
        # Une image qui se construit n'est pas forcement une image qui demarre.
        # Ce controle attrape les manques evidents avant qu'ils coutent un
        # demarrage rate sur du vrai materiel.
        run: |
          podman run --rm "${IMAGE_NAME}:${GITHUB_SHA}" \
            bash -c 'test -x /usr/bin/waydroid-launcher \
                     && test -d /usr/lib/modules \
                     && echo "OK : Waydroid present, noyau present"'

      - name: Se connecter a ghcr.io
        if: github.event_name != 'pull_request'
        run: |
          podman login ghcr.io \
            -u "${{ github.actor }}" \
            -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Publier l'image
        if: github.event_name != 'pull_request'
        run: |
          # ghcr.io n'accepte que des minuscules ; un nom de compte GitHub peut
          # porter des majuscules.
          REG="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          for tag in latest "${GITHUB_SHA}"; do
            podman tag "${IMAGE_NAME}:${GITHUB_SHA}" "${REG}/${IMAGE_NAME}:${tag}"
            podman push "${REG}/${IMAGE_NAME}:${tag}"
          done
          echo "Publie : ${REG}/${IMAGE_NAME}:latest"
          echo ""
          echo "Pour basculer une installation Bazzite sur cette image :"
          echo "  sudo bootc switch --enforce-container-sigpolicy=false ${REG}/${IMAGE_NAME}:latest"
